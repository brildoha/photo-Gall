<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="addTabIndex()">

    <h1>My Photo Gallery</h1>

    <div id="image">
        Hover over or focus on an image to see it here.
    </div>

    <div class="gallery">

        <figure onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500"
                 alt="Sunlight shining through a green forest">
            <figcaption>Forest</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500"
                 alt="Mountain landscape beside a lake">
            <figcaption>Mountains</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500"
                 alt="Beautiful beach with blue ocean water">
            <figcaption>Beach</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500"
                 alt="Green hills and natural landscape">
            <figcaption>Nature</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="undo()"

        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()">

                 alt="Lake surrounded by mountains and trees">
            <figcaption>Lake</figcaption>
        </figure>

    </div>

    <script src="script.js"></script>

</body>
</html>
